name: Verify DK Power

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize package lock [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
        run: npx prisma generate
      - name: Type check
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
          JWT_SECRET: ci-only-placeholder-secret-that-is-not-used-at-runtime
        run: npx tsc --noEmit
      - name: Lint
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
          JWT_SECRET: ci-only-placeholder-secret-that-is-not-used-at-runtime
        run: npm run lint
      - name: Security regression checks
        run: npm run test:security
