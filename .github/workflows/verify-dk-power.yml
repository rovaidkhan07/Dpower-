name: Verify DK Power

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
        run: npx prisma generate
      - name: Type check
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
          JWT_SECRET: ci-only-placeholder-secret-that-is-not-used-at-runtime
        run: npx tsc --noEmit
      - name: Lint
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dkpower
          JWT_SECRET: ci-only-placeholder-secret-that-is-not-used-at-runtime
        run: npm run lint
      - name: Security regression checks
        run: npm run test:security
