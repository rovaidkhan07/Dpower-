name: Bootstrap DK Power

on:
  push:
    paths:
      - '.github/workflows/bootstrap-dkpower.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DK Power
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy latest Kharidly production baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kharidly
          git clone --depth 1 --branch main https://github.com/rovaidkhan07/my-store.git /tmp/kharidly
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.development' \
            --exclude '.vercel/' \
            /tmp/kharidly/ ./
          rm -f .dkpower-init
          rm -f .github/workflows/bootstrap-dkpower.yml

      - name: Commit clean DK Power baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: bootstrap DK Power from Kharidly production baseline [skip ci]'
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          git push --force-with-lease=refs/heads/main:${REMOTE_SHA} origin HEAD:main
